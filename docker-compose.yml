services:

  # ── EarRape Music Platform ───────────────────────────────────────────────
  app:
    build: .
    container_name: earrape-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - DATABASE_PATH=/app/data/spotify.db
      - GTAW_CLIENT_ID=${GTAW_CLIENT_ID:-}
      - GTAW_CLIENT_SECRET=${GTAW_CLIENT_SECRET:-}
      - GTAW_REDIRECT_URI=${GTAW_REDIRECT_URI:-}
    volumes:
      - app-data:/app/data          # SQLite database (persistent)
      - uploads:/app/uploads        # Music tracks & covers (persistent)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/songs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  app-data:
  uploads:
