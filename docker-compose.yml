services:

  # ── FastAPI Application ──────────────────────────────────────────────────
  app:
    build: .
    container_name: earrape-app
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data          # SQLite database
      - uploads:/app/uploads      # Music files & covers
    networks:
      - earrape-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/songs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Nginx Reverse Proxy + SSL ────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: earrape-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
      - uploads:/app/uploads:ro   # Serve uploads directly (faster)
      - ./static:/app/static:ro   # Serve static files directly
    networks:
      - earrape-net
    depends_on:
      - app

  # ── Certbot (Let's Encrypt SSL) ──────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: earrape-certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    # Only runs when called manually or via cron
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  uploads:
  certbot-www:
  certbot-certs:

networks:
  earrape-net:
    driver: bridge
