<!-- EarRape Cat Mascot with Purple / Neon Violet Headphones -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="headbandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="neonPurpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Headphone Arc / Band over head -->
  <path d="M 18 52 A 34 34 0 0 1 82 52" fill="none" stroke="url(#headbandGrad)" stroke-width="6.5" stroke-linecap="round" filter="url(#neonPurpleGlow)"/>

  <!-- Cat Head -->
  <path d="M 32 36 L 24 16 L 42 27 C 47 25 53 25 58 27 L 76 16 L 68 36 C 78 46 78 64 68 74 C 58 84 42 84 32 74 C 22 64 22 46 32 36 Z" fill="#151224" stroke="#a855f7" stroke-width="2.5"/>

  <!-- Cat Inner Ears -->
  <polygon points="28,21 34,32 25,30" fill="#a855f7" opacity="0.75"/>
  <polygon points="72,21 66,32 75,30" fill="#a855f7" opacity="0.75"/>

  <!-- Cat Eyes (Cool chill angled purple eyes) -->
  <path d="M 35 48 Q 42 44 45 50" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
  <path d="M 65 48 Q 58 44 55 50" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>

  <!-- Cat Nose & Mouth -->
  <polygon points="48,56 52,56 50,59" fill="#c084fc"/>
  <path d="M 46 62 Q 50 65 50 59 Q 50 65 54 62" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="28" y1="56" x2="18" y2="54" stroke="rgba(192,132,252,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="60" x2="16" y2="62" stroke="rgba(192,132,252,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="72" y1="56" x2="82" y2="54" stroke="rgba(192,132,252,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="72" y1="60" x2="84" y2="62" stroke="rgba(192,132,252,0.5)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Left Over-Ear Headphone -->
  <rect x="10" y="44" width="14" height="24" rx="7" fill="#0f0d19" stroke="#c084fc" stroke-width="3" filter="url(#neonPurpleGlow)"/>
  <rect x="13" y="48" width="8" height="16" rx="4" fill="url(#purpleGrad)"/>

  <!-- Right Over-Ear Headphone -->
  <rect x="76" y="44" width="14" height="24" rx="7" fill="#0f0d19" stroke="#c084fc" stroke-width="3" filter="url(#neonPurpleGlow)"/>
  <rect x="79" y="48" width="8" height="16" rx="4" fill="url(#purpleGrad)"/>

  <!-- Sound Pulse waves from headphones -->
  <path d="M 6 48 Q 2 56 6 64" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 94 48 Q 98 56 94 64" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
